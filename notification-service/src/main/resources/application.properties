spring.application.name=notification-service
server.port=${PORT:8083}

# ----- PostgreSQL -----
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/notification_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ----- JSON -----
spring.jackson.time-zone=UTC

# ----- Email (Gmail SMTP) -----
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${EMAIL_USER:}
spring.mail.password=${EMAIL_PASS:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from-name=Order Management System

# ----- Eureka -----
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# ----- Actuator -----
management.endpoints.web.exposure.include=health,info

# ----- Kafka (consumer of order-events + stock-events) -----
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:9092}
# Don't crash on startup if a topic isn't created yet (producers own topic creation)
spring.kafka.listener.missing-topics-fatal=false

# ----- Actuator health: custom Kafka indicator + readiness/liveness probes -----
# show-details=always so the "kafka" indicator's brokerCount/clusterId are visible
management.endpoint.health.show-details=always
# Enable Kubernetes-style liveness/readiness probe groups
management.endpoint.health.probes.enabled=true
# Kafka connectivity is a READINESS concern (can we serve traffic?), NOT liveness
# (is the JVM alive?). A broker blip must not trigger a container restart.
management.endpoint.health.group.readiness.include=readinessState,kafka
# Mail connectivity should NOT flip the whole service to DOWN — in-app notifications
# work regardless of SMTP. Disable the auto-configured mail health indicator.
management.health.mail.enabled=false
