spring.application.name=notification-service
server.port=${PORT:8083}

# ----- PostgreSQL -----
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/notification_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ----- JSON -----
spring.jackson.time-zone=UTC

# ----- Email (Gmail SMTP) -----
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${EMAIL_USER:}
spring.mail.password=${EMAIL_PASS:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from-name=Order Management System

# ----- Eureka -----
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# ----- Actuator -----
management.endpoints.web.exposure.include=health,info

# ----- Kafka (consumer of order-events + stock-events) -----
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:9092}
# Don't crash on startup if a topic isn't created yet (producers own topic creation)
spring.kafka.listener.missing-topics-fatal=false
