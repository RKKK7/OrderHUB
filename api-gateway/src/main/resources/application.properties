server.port=${PORT:8080}

spring.application.name=api-gateway

# ----- JWT (same secret as order-service — gateway validates, order-service signs) -----
app.jwt.secret=${JWT_SECRET:change_this_to_a_long_random_secret_string_at_least_32_chars}

# ----- Frontend URL (for CORS) -----
app.client.url=${CLIENT_URL:http://localhost:5173}

# ----- Eureka (parameterized from day one — learned from BloodConnect) -----
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# =============================================
#  ROUTES — map paths to microservices
#  lb:// = load-balanced via Eureka
# =============================================

# Route 1: User auth + profile (order-service owns Users)
spring.cloud.gateway.routes[0].id=user-routes
spring.cloud.gateway.routes[0].uri=lb://order-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/users/**

# Route 2: Orders (order-service)
spring.cloud.gateway.routes[1].id=order-routes
spring.cloud.gateway.routes[1].uri=lb://order-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/orders/**

# Route 3: Admin dashboard + order management (order-service)
spring.cloud.gateway.routes[2].id=admin-routes
spring.cloud.gateway.routes[2].uri=lb://order-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/admin/**

# Route 4: Products (product-service)
spring.cloud.gateway.routes[3].id=product-routes
spring.cloud.gateway.routes[3].uri=lb://product-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/products/**

# Route 5: Notifications (notification-service)
spring.cloud.gateway.routes[4].id=notification-routes
spring.cloud.gateway.routes[4].uri=lb://notification-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/notifications/**

# =============================================
#  Gateway settings
# =============================================
spring.cloud.gateway.discovery.locator.enabled=false
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Actuator
management.endpoints.web.exposure.include=health,info,gateway

# Logging
logging.level.org.springframework.cloud.gateway=INFO
logging.level.com.oms.gateway=DEBUG
