spring.application.name=product-service
server.port=${PORT:8081}

# ----- PostgreSQL -----
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/product_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ----- JSON -----
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# ----- Redis -----
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000ms

# ----- Cache toggle -----
# false = no Redis required locally (default for IntelliJ dev)
# true  = Redis must be running (Docker Compose sets this)
app.cache.enabled=${CACHE_ENABLED:false}

# ----- Eureka -----
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# ----- Actuator -----
management.endpoints.web.exposure.include=health,info
